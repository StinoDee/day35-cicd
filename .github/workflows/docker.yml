name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            docker pull stinodee/day35-cicd:latest

            # Run new container on different port
            docker run -d -p 8081:80 --name myapp_new stinodee/day35-cicd:latest

            # Wait for container
            sleep 5

            # Stop and remove old container
            docker rm -f myapp || true

            # Rename new container
            docker rename myapp_new myapp
