name: Production Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull stinodee/day35-cicd:latest

            # Detect active container
            if docker ps | grep -q myapp_blue; then
              NEW_CONTAINER="myapp_green"
              NEW_PORT=8081
              OLD_CONTAINER="myapp_blue"
              OLD_PORT=8080
            else
              NEW_CONTAINER="myapp_blue"
              NEW_PORT=8080
              OLD_CONTAINER="myapp_green"
              OLD_PORT=8081
            fi

            echo "Deploying to $NEW_CONTAINER on port $NEW_PORT"

            # Run new container
            docker run -d -p $NEW_PORT:80 --name $NEW_CONTAINER stinodee/day35-cicd:latest

            sleep 5

            # Health check
            curl -f http://localhost:$NEW_PORT || exit 1

            # Switch Nginx
            sudo sed -i "s/$OLD_PORT/$NEW_PORT/g" /etc/nginx/sites-enabled/default
            sudo systemctl reload nginx

            # Remove old container
            docker rm -f $OLD_CONTAINER || true
